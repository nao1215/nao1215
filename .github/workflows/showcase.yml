name: Update showcase

# Redraws the repository cards and the showcase section of README.md.
# Edit .github/readme-showcase.yml to add, remove, or reorder repositories.

on:
  schedule:
    - cron: "7 * * * *" # hourly
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/readme-showcase.yml"
      - ".github/workflows/showcase.yml"

permissions:
  contents: write

concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate cards and README
        id: showcase
        uses: nao1215/action-readme-showcase@c659c0984925f950d8220a37a132165df175c1a7 # owner-wide public total

      - name: Commit changes
        if: steps.showcase.outputs.changed == 'true'
        run: |
          git add README.md cards
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update showcase cards"
          git push
