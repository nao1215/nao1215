name: Update showcase

# Redraws the repository cards and the showcase section of README.md.
# Edit showcase/config.json to add, remove, or reorder repositories.

on:
  schedule:
    - cron: "7 * * * *" # hourly
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "showcase/**"
      - ".github/workflows/showcase.yml"

permissions:
  contents: write

concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: showcase/go.mod
          cache: false

      - name: Test
        working-directory: showcase
        run: go test ./...

      - name: Generate cards and README
        working-directory: showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run .

      - name: Commit changes
        run: |
          git add README.md cards
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update showcase cards"
          git push
